name: CI

on: [push]

# O job só lê o código; o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (tags conferidas via API do GitHub em 2026-10-12).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (v5.0.0)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
